<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="styles/style.css" />

</head>

<body class="container">
    <!-- From Uiverse.io by amir_6539 -->
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>


    <h3 class="titulo">CALCULADORA</h3>
    <div class="calculadora">
        <div class="pantalla">
            <input type="text" name="" id="auxiliar" disabled />

            <input type="text" name="" id="principal" disabled />
        </div>

        <div class="botones">
            <div class="linea-btn">
                <button class="btn-glow" id="7">7</button>
                <button class="btn-glow" id="8">8</button>
                <button class="btn-glow" id="9">9</button>
                <button class="btn-glow operacion" id="divicion">/</button>
            </div>
            <div class="linea-btn">
                <button class="btn-glow" id="4">4</button>
                <button class="btn-glow" id="5">5</button>
                <button class="btn-glow" id="6">6</button>
                <button class="btn-glow operacion" id="multip">*</button>
            </div>

            <div class="linea-btn">
                <button class="btn-glow" id="1">1</button>
                <button class="btn-glow" id="2">2</button>
                <button class="btn-glow" id="3">3</button>
                <button class="btn-glow operacion" id="resta">-</button>
            </div>
            <div class="linea-btn">
                <button class="btn-glow" id=",">.</button>
                <button class="btn-glow" id="0">0</button>
                <button class="btn-glow" id="borrar">←</button>
                <button class="btn-glow operacion" id="suma">+</button>
            </div>
            <div class="linea-btn">
                <button class="btn-glow" id="clear">C</button>
                <button class="btn-glow" id="igual">=</button>
            </div>
        </div>
    </div>
    </div>
        <div class="container">
            <div id="stars"></div>
            <div id="stars2"></div>
            <div id="stars3"></div>
            <div id=""></div>
        </div>
    <script src="js/calculadora.js"></script>
</body>

</html>
